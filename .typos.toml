# Typos check: https://github.com/crate-ci/typos

# Ignore specific file types
[type.csr]
extend-glob = ["*.csr"]
check-file = false

# Ignore specific files and patterns
[files]
extend-exclude = [
  "LICENSE",
  "*.sum",
  "go.sum",
  "*.trpc.go",
  "*.pb.go",
  "*_string.go",
  "*.gen.go",
  "evaluation/internal/rouge/testdata/",
  "evaluation/internal/rouge/tokenizer.go",
  "examples/"
]

# Allow specific identifiers
[default.extend-identifiers]
O_WRONLY = "O_WRONLY"

# Allow specific words
[default.extend-words]
unmarshaling = "unmarshaling" 
Unarshaling = "Unmarshaling" 
Indexes = "Indexes"
Indexs = "Indexs"
indexes = "indexes"
indexs = "indexs"
Sur = "Sur"
ba = "ba"
UE = "UE"
rin = "rin"
dify = "dify"
countr = "countr"
daa = "daa"
# require_human_reveiw is deliberately misspelled in
# policy_strict_yaml_test.go to verify that unknown YAML fields are
# rejected by KnownFields(true). Do not "fix" that spelling.
reveiw = "reveiw"
