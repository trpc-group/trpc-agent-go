# 通过 --config 显式加载本文件的副本；CR Agent 不会自动读取当前目录配置。
# cr-agent.yaml 已被 .gitignore 忽略。

mode: review
runtime: container
output_dir: .cr-agent/reports
# 必须指向随安装分发的受信任 Skill 目录，不能指向待审仓库。
skills_root: /opt/cr-agent/skills
fixtures_root: testdata/fixtures
staticcheck: false

# 默认数据库位于 output_dir/review.db；也可以显式指定路径或用 no_persist 关闭。
# sqlite: .cr-agent/review.db
no_persist: false

# 需要接入真实 LLM 时，启用 model 并取消下面 provider 配置注释。
# API key 推荐通过环境变量提供，不要写入 YAML。
#
# model:
#   enabled: true
#   provider: deepseek
#   name: deepseek-chat
#   api_key_env: DEEPSEEK_API_KEY
#
# OpenAI-compatible 私有网关示例：
#
# model:
#   enabled: true
#   provider: openai-compatible
#   name: your-model-name
#   base_url: https://your-gateway.example.com/v1
#   api_key_env: OPENAI_API_KEY
